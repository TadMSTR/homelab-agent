title = "homelab-agent public repo config"

[extend]
useDefault = true

# Block real internal IPs (the sanitization rules replace these with placeholders)
[[rules]]
id = "real-internal-ip-lan"
description = "Real LAN IPs (192.168.1.x range)"
regex = '''192\.168\.1\.\d{1,3}'''
tags = ["homelab", "internal-ip"]

[[rules]]
id = "real-internal-ip-nfs"
description = "Real NFS/VLAN IPs (10.10.1.x range)"
regex = '''10\.10\.1\.\d{1,3}'''
tags = ["homelab", "internal-ip"]

[[rules]]
id = "real-internal-ip-docker"
description = "Docker bridge gateway IP (172.18.0.x range)"
regex = '''172\.18\.0\.\d{1,3}'''
tags = ["homelab", "internal-ip"]

[allowlist]
description = "Known-safe placeholder patterns and documentation references"
regexes = [
    '''<server-ip>''',
    '''<nas-ip>''',
    '''<lan-subnet>''',
    '''<docker-bridge-ip>''',
    '''\$\{.*\}''',
    '''your-domain''',
    '''example\.com''',
    '''yourdomain''',
    '''<your-hostname>''',
    '''<authentik-outpost-id>''',
]
