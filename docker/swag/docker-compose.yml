services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - URL=${DOMAIN}
      - SUBDOMAINS=wildcard
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - EMAIL=${LETSENCRYPT_EMAIL}
      - STAGING=false
    volumes:
      - /opt/appdata/swag:/config
      - /home/ted/repos/personal/helm-owners-manual/site:/config/www/owners-manual:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - forge-net
    restart: unless-stopped

networks:
  forge-net:
    external: true
