server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.*;

    include /config/nginx/ssl.conf;

    include /config/nginx/authentik-server.conf;

    location / {
        include /config/nginx/authentik-location.conf;
        root /config/www/owners-manual;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
