server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hister.*;

    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    include /config/nginx/authentik-server.conf;

    # SECURITY[accepted]: /api/ and /mcp exempt from Authentik forward auth. Browser extension
    # and MCP clients authenticate via Hister's own bearer token (256-bit entropy, HTTPS only).
    # Web UI at / remains behind Authentik. searxng-mcp accesses Hister via internal Docker DNS,
    # bypassing SWAG entirely. Audit: 2026-06-07/hister-searxng-mcp-2026-06.
    # Browser extension API — exempt from forward auth
    # Extension sends Authorization: Bearer <access_token> directly
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app searxng-hister;
        set $upstream_port 4434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # MCP endpoint — exempt from forward auth
    # MCP clients send Authorization: Bearer <access_token> directly
    location /mcp {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app searxng-hister;
        set $upstream_port 4434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Web UI — Authentik forward auth
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/authentik-location.conf;
        set $upstream_app searxng-hister;
        set $upstream_port 4434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
