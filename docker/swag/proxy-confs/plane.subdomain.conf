server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name plane.*;

    include /config/nginx/ssl.conf;
    include /config/nginx/authentik-server.conf;

    client_max_body_size 50m;

    # Main UI — Authentik forward auth
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/authentik-location.conf;
        set $upstream_app plane-web;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Instance admin — Authentik forward auth
    location /god-mode/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/authentik-location.conf;
        set $upstream_app plane-admin;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # REST API — no forward auth (agent API tokens); rate limited (NE-03)
    location /api/ {
        limit_req zone=plane_api burst=20 nodelay;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app plane-api;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Auth endpoint — no forward auth (Plane's own auth flow); rate limited (NE-03)
    location /auth/ {
        limit_req zone=plane_auth burst=5 nodelay;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app plane-api;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # WebSocket live — Authentik forward auth
    location /live/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/authentik-location.conf;
        set $upstream_app plane-live;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Public spaces — no forward auth
    location /spaces/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app plane-space;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # MinIO uploads — no Authentik forward auth (presigned URL SigV4 is the auth mechanism;
    # adding Authentik here blocks presigned PUT requests from the browser).
    # No trailing slash on location — presigned POST targets /uploads (bare bucket URL);
    # location /uploads/ would 301 that to /uploads/ and POST becomes GET.
    location /uploads {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app plane-minio;
        set $upstream_port 9000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
