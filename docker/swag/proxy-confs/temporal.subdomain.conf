server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name temporal.*;

    include /config/nginx/ssl.conf;

    include /config/nginx/authentik-server.conf;
    # SECURITY[control]: Authentik ProxyProvider verified 2026-06-01 via Django shell:
    # mode=forward_single, external_host=https://temporal.helmforge.me, in Embedded Outpost.
    # Provider was created via ak shell (no API audit trail). Audit: temporal-forge-2026-06.

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/authentik-location.conf;
        set $upstream_app temporal-ui;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
