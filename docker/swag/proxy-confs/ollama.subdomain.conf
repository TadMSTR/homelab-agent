# make sure that your ollama container is named ollama
# make sure that your dns has a cname set for ollama

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ollama.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    # enable for Authentik (requires authentik-location.conf in the location block)
    include /config/nginx/authentik-server.conf;

    location / {
        # enable for Authentik (requires authentik-server.conf in the server block)
        include /config/nginx/authentik-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ollama;
        set $upstream_port 11434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Block destructive endpoints — model management requires Authentik auth (use root /)
    location ~ ^/api/(delete|pull|push|copy) {
        return 403;
    }

    # API endpoint — LAN-only, no auth required for internal clients
    # Rate limited: 10r/s burst 30 — claudebox (<server-ip>) bypasses via geo block
    location /api {
        allow <lan-subnet>;
        allow <nas-subnet>/24;
        deny all;
        limit_req zone=ollama_api burst=30 nodelay;
        client_max_body_size 10m;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ollama;
        set $upstream_port 11434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
    
    location /v1 {
        allow <lan-subnet>;
        allow <nas-subnet>/24;
        deny all;
        limit_req zone=ollama_api burst=30 nodelay;
        client_max_body_size 10m;
        auth_request off;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ollama;
        set $upstream_port 11434;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
    
}
