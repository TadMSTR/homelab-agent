services:
  task-queue-mcp:
    build:
      context: /home/ted/repos/personal/task-queue-mcp
      dockerfile: Dockerfile
    container_name: task-queue-mcp
    user: "1000:1000"
    ports:
      - "127.0.0.1:8485:8485"
    environment:
      - TASK_QUEUE_DIR=/task-queue
      - MCP_PORT=8485
    volumes:
      - /home/ted/.claude/task-queue:/task-queue
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - forge-net
    restart: unless-stopped

networks:
  forge-net:
    external: true
