services:
  searxng:
    image: searxng/searxng@sha256:dac0c447bdd3f20a43687c6bed8140547f493252fd7bad3ad8bef1faffe1002d
    container_name: searxng
    volumes:
      - /opt/appdata/searxng/searxng:/etc/searxng:rw
    tmpfs:
      - /var/cache/searxng:size=64m
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_VALKEY_URL=valkey://:${DRAGONFLY_PASSWORD}@searxng-dragonfly:6379/0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - forge-net
      - searxng-internal
    depends_on:
      - searxng-dragonfly
    restart: unless-stopped

  searxng-hister:
    image: ghcr.io/asciimoo/hister@sha256:ce5e7439726b6ccb0ed9abda91a16b1034bd5be4c25abee81307c006abcd3fd8
    container_name: searxng-hister
    command: ["listen", "--config", "/hister/data/config.yml"]
    user: '1000:1000'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:4434/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      - HISTER__SERVER__ADDRESS=0.0.0.0:4434
      - HISTER__SERVER__BASE_URL=https://hister.helmforge.me
      - HISTER__APP__SEARCH_URL=https://search.helmforge.me/search?q={query}
      - HISTER__APP__REDIRECT_ON_NO_RESULTS=false
    ports:
      - "127.0.0.1:4434:4434"
    volumes:
      - /opt/appdata/searxng/hister:/hister/data
    networks:
      - forge-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  searxng-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.2
    container_name: searxng-dragonfly
    restart: unless-stopped
    command: ["--proactor_threads=2", "--maxmemory=512mb", "--snapshot_cron=*/30 * * * *", "--requirepass=${DRAGONFLY_PASSWORD}"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - /opt/appdata/searxng/dragonfly:/data
    networks:
      - searxng-internal
      - forge-net
      - grafana-datasources

networks:
  forge-net:
    external: true
  searxng-internal:
    driver: bridge
  grafana-datasources:
    external: true
