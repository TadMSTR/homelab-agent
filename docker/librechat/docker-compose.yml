services:
  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.5
    container_name: librechat
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@librechat-mongodb:27017/LibreChat?authSource=admin
      - MEILI_HOST=http://librechat-meilisearch:7700
    env_file:
      - .env
    volumes:
      - /opt/appdata/librechat/librechat/librechat.yaml:/app/librechat.yaml
      - /opt/appdata/librechat/librechat/data:/app/data
      - /opt/appdata/librechat/librechat/images:/app/client/public/images
      - /opt/appdata/librechat/librechat/logs:/app/api/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - librechat-mongodb
      - librechat-meilisearch
    networks:
      - forge-net
      - librechat-internal
    restart: unless-stopped

  librechat-mongodb:
    image: mongo:7.0
    container_name: librechat-mongodb
    command: ["mongod", "--auth"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - /opt/appdata/librechat/mongodb:/data/db
      - /opt/appdata/librechat/mongodb-configdb:/data/configdb
    networks:
      - librechat-internal
    restart: unless-stopped

  librechat-meilisearch:
    image: getmeili/meilisearch:v1.44.0
    container_name: librechat-meilisearch
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - /opt/appdata/librechat/meilisearch:/meili_data
    networks:
      - librechat-internal
    restart: unless-stopped

  librechat-mcp:
    image: ghcr.io/tadmstr/librechat-mcp:latest
    container_name: librechat-mcp
    ports:
      - "127.0.0.1:8496:8496"
    environment:
      - LIBRECHAT_URL=http://librechat:3080
      - LIBRECHAT_ADMIN_EMAIL=${LIBRECHAT_MCP_EMAIL}
      - LIBRECHAT_ADMIN_PASSWORD=${LIBRECHAT_MCP_PASSWORD}
      - MCP_PORT=8496
    depends_on:
      - librechat
    networks:
      - librechat-internal
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"

networks:
  forge-net:
    external: true
  librechat-internal:
    driver: bridge
