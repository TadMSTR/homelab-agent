services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:35.0.2-ls460
    container_name: nextcloud
    restart: unless-stopped
    # F-06: LSIO s6-overlay uses setuid at init — user: and no-new-privileges both break it.
    # PUID/PGID=1000 drop is the LSIO mitigation. Leave hardening as-is per audit 2026-06-20.
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=lscr.io/linuxserver/mods:nextcloud-notify-push
    volumes:
      - /opt/appdata/nextcloud/config:/config
      - /opt/appdata/nextcloud/data:/data
      # :ro: agents read this tree as instructions, and an RCE in this container must not be able
      # to write it. files:scan only writes the DB. The :ro bind is the write control; Nextcloud's
      # external-storage readonly option is only a mask.
      - ${HOME}/.claude/comms/artifacts:/agent-workspace:ro
      # No repos mount: it would expose scripts, agent config and checkout secrets (.env files)
      # to Nextcloud. Browse repos in your git host instead.
      - ${HOME}/Documents:/personal/Documents
    networks:
      - nextcloud-internal
      - forge-net
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-valkey:
        condition: service_started
    mem_limit: 2g
    cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:443/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nextcloud-db:
    image: postgres:18.6-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    # F-06: cap_drop:[ALL] breaks postgres — init runs as root, uses chown/chmod on data dir before
    # dropping to postgres user. security_opt only; upstream constraint documented per audit 2026-06-20.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${NC_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
      POSTGRES_DB: nextcloud
    # PG 18+ layout (docker-library/postgres#1259): PGDATA is /var/lib/postgresql/18/docker and
    # the image VOLUME is /var/lib/postgresql. Mount the parent: the old .../data target would
    # put the database in an anonymous volume. Data lands in /opt/appdata/nextcloud/db/18/docker.
    # The next major can pg_upgrade --link inside this one mount (19/docker beside 18/docker).
    # Nextcloud connects as oc_admin (owns every object), not POSTGRES_USER: a dump/restore
    # must carry that role and keep ownership.
    volumes:
      - /opt/appdata/nextcloud/db:/var/lib/postgresql
    mem_limit: 1g
    cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NC_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud-internal

  nextcloud-valkey:
    image: valkey/valkey:8
    container_name: nextcloud-valkey
    restart: unless-stopped
    # F-06: cap_drop:[ALL] breaks valkey — init chowns /data as root before dropping to valkey user.
    security_opt:
      - no-new-privileges:true
    command: >
      valkey-server
      --requirepass ${NC_VALKEY_PASSWORD}
    mem_limit: 512m
    cpus: '0.5'
    networks:
      - nextcloud-internal

  nextcloud-opensearch:
    image: opensearchproject/opensearch:2
    container_name: nextcloud-opensearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    environment:
      - discovery.type=single-node
      # SECURITY[accepted]: OpenSearch security plugin disabled (no auth/TLS). Internal-only — nextcloud-internal
      # network only, no host port, no forge-net access. Single-tenant forge; TLS cert overhead exceeds risk.
      # Audit: 2026-06-20/nextcloud-2026-06. F-09.
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=nextcloud-opensearch
    volumes:
      - /opt/appdata/nextcloud/opensearch:/usr/share/opensearch/data
    mem_limit: 1g
    cpus: '1.0'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - nextcloud-internal

  nextcloud-clamav:
    image: clamav/clamav:1.5.4
    container_name: nextcloud-clamav
    restart: unless-stopped
    # F-06: cap_drop:[ALL] may break clamd/freshclam init — keeping security_opt only per upstream constraint.
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/appdata/nextcloud/clamav:/var/lib/clamav
    mem_limit: 2g
    cpus: '1.0'
    networks:
      - nextcloud-internal

  nextcloud-collabora:
    # SECURITY[accepted]: uid 1001, no cap_drop/no-new-privileges (DC-02).
    # Already explained immediately below — CODE's chroot/setuid sandbox breaks
    # under both. mem_limit IS set (1 GiB), so DC-03 is satisfied here.
    image: collabora/code:26.04.3.2.1
    container_name: nextcloud-collabora
    restart: unless-stopped
    # F-06: no-new-privileges NOT added — CODE uses chroot/setuid sandbox (breaks if set).
    # cap_drop:[ALL] breaks coolforkit — needs SYS_CHROOT/SETUID/SETGID/FOWNER for sandbox init.
    # Upstream constraint; default Docker cap set required. Audit 2026-06-20 finding revised.
    environment:
      - domain=nextcloud\\.example\\.com
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      - username=${NC_COLLABORA_ADMIN_USER:-admin}
      - password=${NC_COLLABORA_ADMIN_PASSWORD}
    mem_limit: 1g
    cpus: '2.0'
    networks:
      - nextcloud-internal
      - forge-net

  nextcloud-whiteboard:
    image: ghcr.io/nextcloud/whiteboard:v2.1.2
    container_name: nextcloud-whiteboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NEXTCLOUD_URL=https://nextcloud.example.com
      # Recording disabled: v2's recorder runs a --no-sandbox Chromium that any write-JWT
      # holder (edit-enabled public links included) can start. A non-existent path fails every launch.
      - CHROME_EXECUTABLE_PATH=/nonexistent/recording-disabled
      - JWT_SECRET_KEY=${NC_WHITEBOARD_JWT_SECRET}
    mem_limit: 512m
    cpus: '0.5'
    # forge-net only: it reaches Nextcloud via NEXTCLOUD_URL through SWAG, and SWAG
    # reaches it on forge-net; nextcloud-internal exposed the no-auth OpenSearch, clamd, Valkey and Postgres.
    networks:
      - forge-net

networks:
  nextcloud-internal:
    name: nextcloud-internal
  forge-net:
    external: true
