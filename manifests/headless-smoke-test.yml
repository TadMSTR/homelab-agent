agent_type: headless-smoke-test
description: "Post-deploy smoke tester — runs health checks after build-finalize and reports results"

modules:
  homelab-ops:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://localhost:8282/mcp
      tool_allowlist:
        - run_command
        - read_file
        - write_file
        - edit_file
        - list_processes

  matrix:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://127.0.0.1:8487/mcp
      tool_allowlist:
        - send_matrix_message

  task-queue:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://127.0.0.1:8485/mcp
      tool_allowlist:
        - update_task
        - get_task
