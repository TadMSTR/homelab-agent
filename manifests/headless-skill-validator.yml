agent_type: headless-skill-validator
description: "Skill schema validator — validates SKILL.md structure before prime-directive commit"

modules:
  homelab-ops:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://localhost:8282/mcp
      tool_allowlist:
        - read_file
        - read_directory

  task-queue:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://127.0.0.1:8485/mcp
      tool_allowlist:
        - update_task
        - get_task
