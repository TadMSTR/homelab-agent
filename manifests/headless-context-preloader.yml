agent_type: headless-context-preloader
description: "Context pre-loader — reads in-scope files and writes a context snapshot before build sessions"

modules:
  homelab-ops:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://localhost:8282/mcp
      tool_allowlist:
        - read_file
        - read_directory
        - write_file

  task-queue:
    type: mcp_proxy
    config:
      url: <FILL_AT_DEPLOY>    # http://127.0.0.1:8485/mcp
      tool_allowlist:
        - update_task
        - get_task
